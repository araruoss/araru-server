services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: araru
      POSTGRES_USER: araru
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U araru -d araru"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://araru:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/araru
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173
      LOCAL_LIBRARY_DIR: /library
      ARARU_PROCESS_JOBS: ${ARARU_PROCESS_JOBS:-true}
    volumes:
      - ${ARARU_LIBRARY_PATH:-./library}:/library:ro
      - server-data:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    profiles: ["scale"]
    build: .
    command: npm run worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://araru:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/araru
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      ARARU_PROCESS_JOBS: "true"
    volumes:
      - ${ARARU_LIBRARY_PATH:-./library}:/library:ro
      - server-data:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
  server-data:
