services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: araru
      POSTGRES_USER: araru
      POSTGRES_PASSWORD: araru
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U araru -d araru"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://araru:araru@postgres:5432/araru
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173
      LOCAL_LIBRARY_DIR: /library
    ports: ["3001:3001"]
    volumes:
      - ${ARARU_LIBRARY_PATH:-./library}:/library:ro
      - server-data:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
  server-data:
